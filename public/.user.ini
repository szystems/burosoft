; Configuración PHP personalizada para iPage
; Deshabilitar extensiones problemáticas y optimizar para Laravel

; CRÍTICO: Deshabilitar ctype problemático
; extension=ctype

; Configuración de memoria y tiempo
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; Configuración de archivos
upload_max_filesize = 50M
post_max_size = 50M
max_file_uploads = 20

; Configuración de errores
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED

; Configuración de sesiones
session.gc_maxlifetime = 3600
session.cookie_httponly = On

; Configuración de OPcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 4000
opcache.revalidate_freq = 2

; Configuración específica para Laravel
allow_url_fopen = On
allow_url_include = Off

; Timezone
date.timezone = "America/Guatemala"
